name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (build, tests, format, style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api-java/pom.xml
      - name: Build, test, Spotless and Checkstyle
        run: cd apps/api-java && ./mvnw -B -ntp verify

  contract:
    name: HTTP contract (the API run for real, against Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: customer_compass
          POSTGRES_USER: customer_compass
          POSTGRES_PASSWORD: customer_compass_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U customer_compass -d customer_compass"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api-java/pom.xml
      - name: Start the API (Flyway builds the schema and demo data)
        run: |
          cd apps/api-java
          ./mvnw -B -ntp -q -DskipTests package
          nohup java -jar target/api-java-0.1.0.jar > "$RUNNER_TEMP/api.log" 2>&1 &
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:8001/health
      - name: The CRM contract holds
        run: python3 contracts/http/crm_contract.py http://localhost:8001
      - name: API log on failure
        if: failure()
        run: tail -50 "$RUNNER_TEMP/api.log"

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docs:
    name: Docs (links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path node_modules '**/*.md'
          fail: true

  security:
    name: Security (secrets, dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Web dependency audit (npm)
        run: npm audit --omit=dev --audit-level=high
      - name: Trivy (repo files)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          skip-dirs: node_modules,apps/api-java/target
          ignore-unfixed: true
          exit-code: "1"
